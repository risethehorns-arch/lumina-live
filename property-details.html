<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Property — Lumina</title>
  <meta name="description" content="Private property details — Lumina portfolio, Amman." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0A0A0B" />
  <link rel="icon" type="image/png" href="/assets/lumina-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --pd-void: #0A0A0B;
      --pd-panel: #111114;
      --pd-champagne: #C9A87C;
      --pd-cream: #F4EFE6;
      --pd-muted: rgba(244, 239, 230, 0.55);
      --pd-line: rgba(244, 239, 230, 0.1);
    }

    body {
      background: var(--pd-void);
      color: var(--pd-cream);
      margin: 0;
    }

    .nav-links .active-link { color: var(--pd-champagne); }

    /* ── shell ── */
    .pd {
      min-height: 100vh;
      padding-top: 80px;
      padding-bottom: 100px;
      background: var(--pd-void);
    }

    /* ── gallery ── */
    .pd-gallery {
      position: relative;
      width: 100%;
      background: #0d0d10;
      user-select: none;
      touch-action: pan-y;
    }

    .pd-viewport {
      position: relative;
      width: 100%;
      height: min(68vh, 720px);
      min-height: 280px;
      overflow: hidden;
      cursor: grab;
    }
    .pd-viewport.is-dragging { cursor: grabbing; }

    .pd-track {
      display: flex;
      height: 100%;
      will-change: transform;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pd-track.no-anim { transition: none; }

    .pd-slide {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      background: #121218;
    }
    .pd-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* arrows */
    .pd-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(10,10,11,0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
    }
    .pd-nav:hover {
      background: rgba(201,168,124,0.22);
      border-color: rgba(201,168,124,0.55);
    }
    .pd-nav:disabled {
      opacity: 0.25;
      pointer-events: none;
    }
    .pd-nav svg { width: 18px; height: 18px; }
    .pd-nav--prev { left: 14px; }
    .pd-nav--next { right: 14px; }

    /* counter + dots */
    .pd-chrome {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      background: linear-gradient(180deg, transparent, rgba(10,10,11,0.75));
      pointer-events: none;
    }
    .pd-chrome > * { pointer-events: auto; }

    .pd-counter {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.78);
      font-variant-numeric: tabular-nums;
      background: rgba(10,10,11,0.4);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 12px;
      backdrop-filter: blur(8px);
    }

    .pd-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 55%;
    }
    .pd-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      background: rgba(255,255,255,0.28);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .pd-dot[aria-current="true"] {
      background: var(--pd-champagne);
      transform: scale(1.25);
    }

    /* thumbs */
    .pd-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px 4px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .pd-thumbs::-webkit-scrollbar { display: none; }
    .pd-thumb {
      flex: 0 0 auto;
      width: 72px;
      height: 54px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid transparent;
      padding: 0;
      background: #1a1a20;
      cursor: pointer;
      scroll-snap-align: start;
      opacity: 0.65;
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }
    .pd-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .pd-thumb[aria-current="true"] {
      opacity: 1;
      border-color: var(--pd-champagne);
    }

    /* ── content ── */
    .pd-body {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .pd-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--pd-muted);
      margin-bottom: 22px;
      transition: color 0.25s ease;
    }
    .pd-back:hover { color: var(--pd-champagne); }

    .pd-kicker {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--pd-champagne);
      margin: 0 0 12px;
    }

    .pd-title {
      font-family: var(--font-serif), Georgia, serif;
      font-size: clamp(1.75rem, 4.5vw, 2.6rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      color: #fff;
    }

    .pd-location {
      font-size: 0.9rem;
      color: var(--pd-muted);
      margin: 0 0 18px;
    }

    .pd-price {
      font-family: var(--font-serif), Georgia, serif;
      font-size: clamp(1.4rem, 3vw, 1.85rem);
      color: var(--pd-champagne);
      margin: 0 0 22px;
      letter-spacing: -0.01em;
    }

    .pd-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 28px;
      padding: 0;
      list-style: none;
    }
    .pd-specs li {
      font-size: 0.8rem;
      color: rgba(244,239,230,0.78);
      border: 1px solid var(--pd-line);
      background: rgba(255,255,255,0.03);
      border-radius: 999px;
      padding: 8px 14px;
    }
    .pd-specs li b {
      font-weight: 600;
      color: #fff;
      margin-right: 4px;
    }

    .pd-desc {
      margin: 0 0 28px;
      padding-top: 22px;
      border-top: 1px solid var(--pd-line);
    }
    .pd-desc h2 {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pd-muted);
      font-weight: 500;
      margin: 0 0 12px;
      font-family: inherit;
    }
    .pd-desc p {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.75;
      color: rgba(244,239,230,0.72);
    }

    .pd-meta {
      display: grid;
      gap: 10px 24px;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      margin: 0 0 8px;
      padding: 18px 0 0;
      border-top: 1px solid var(--pd-line);
    }
    .pd-meta dt {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--pd-muted);
      margin: 0 0 4px;
    }
    .pd-meta dd {
      margin: 0;
      font-size: 0.92rem;
      color: #fff;
    }

    /* sticky CTA bar */
    .pd-cta {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      display: flex;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(10,10,11,0.88);
      border-top: 1px solid var(--pd-line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .pd-cta a {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .pd-cta a:active { transform: scale(0.98); }
    .pd-cta-primary {
      background: linear-gradient(100deg, #E8A54B, #C9A87C);
      color: #14100A;
      border: 0;
    }
    .pd-cta-ghost {
      background: transparent;
      color: var(--pd-cream);
      border: 1px solid rgba(244,239,230,0.22);
    }
    .pd-cta-ghost:hover { border-color: var(--pd-champagne); color: var(--pd-champagne); }

    /* not found */
    .pd-empty {
      min-height: 70vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 48px 20px;
    }
    .pd-empty h1 {
      font-family: var(--font-serif), Georgia, serif;
      font-weight: 400;
      font-size: 1.8rem;
      margin: 0 0 12px;
    }
    .pd-empty p { color: var(--pd-muted); margin: 0 0 24px; }
    .pd-empty a {
      color: var(--pd-champagne);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 720px) {
      .pd-viewport { height: min(52vh, 480px); }
      .pd-nav { width: 38px; height: 38px; }
      .pd-nav--prev { left: 10px; }
      .pd-nav--next { right: 10px; }
      .pd-dots { max-width: 48%; }
      .pd-dot { width: 6px; height: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pd-track { transition: none; }
    }

    /* hide bulky site footer CTA overlap */
    .footer { margin-bottom: 0; padding-bottom: 24px; }
  </style>
</head>
